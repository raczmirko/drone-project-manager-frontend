name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        id: verify_version
        run: |
          # Extract version from package.json
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.ref_name }}"
          # Remove 'v' prefix from the tag if it exists
          CLEAN_TAG="${TAG#v}"
          if [ "$PACKAGE_VERSION" != "$CLEAN_TAG" ]; then
            echo "Error: Tag '$TAG' does not match version '$PACKAGE_VERSION' in package.json"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/raczmirko/drone-project-manager-frontend:latest
            ghcr.io/raczmirko/drone-project-manager-frontend:${{ github.ref_name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/apps/drone-project-manager
            docker compose pull frontend
            docker compose up -d --no-deps --force-recreate frontend